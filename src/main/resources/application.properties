spring.application.name=taskapi

# Real Postgres connection now that docker-compose provides one (Phase 2).
# The ${POSTGRES_DB:taskapi} syntax means "read env var POSTGRES_DB, or fall back to
# 'taskapi' if it's not set" - these defaults are kept matching .env.example so local
# dev works without manually exporting anything.
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:taskapi}
spring.datasource.username=${POSTGRES_USER:taskapi}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}

# Hibernate auto-creates/updates tables from our @Entity classes. Fine for learning;
# a real production system would use Flyway/Liquibase migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Keeps the DB session open only for the controller method's duration, not the whole
# HTTP response - avoids accidental lazy-loading-outside-a-transaction surprises later.
spring.jpa.open-in-view=false

# JWT signing key, read from the JWT_SECRET env var (must be >= 32 bytes for HS256).
# The fallback value below ONLY exists so the project runs out-of-the-box for local
# learning - a real deployment MUST set a real JWT_SECRET via its own env var/secret
# manager and never rely on a value that lives in source control.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-placeholder-secret-please-override-32bytes}
app.jwt.expiration-minutes=30

# First ADMIN account, created once at startup if it doesn't already exist (Phase 6).
# Same pattern as above: a safe placeholder default for local learning, overridden via
# real env vars for anything that matters.
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:AdminPass123!}
