spring.application.name=taskapi

# TEMPORARY: spring-boot-starter-data-jpa + the postgres driver are on the classpath
# (final stack), but there's no database yet - that's wired up in Phase 2. Without this
# line Spring Boot would try to auto-create a DataSource at startup and crash.
# Removed in Phase 2 once docker-compose provides a real Postgres connection.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
