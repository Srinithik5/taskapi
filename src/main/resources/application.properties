spring.application.name=taskapi

# Real Postgres connection now that docker-compose provides one (Phase 2).
# The ${POSTGRES_DB:taskapi} syntax means "read env var POSTGRES_DB, or fall back to
# 'taskapi' if it's not set" - these defaults are kept matching .env.example so local
# dev works without manually exporting anything.
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:taskapi}
spring.datasource.username=${POSTGRES_USER:taskapi}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}

# Hibernate auto-creates/updates tables from our @Entity classes. Fine for learning;
# a real production system would use Flyway/Liquibase migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Keeps the DB session open only for the controller method's duration, not the whole
# HTTP response - avoids accidental lazy-loading-outside-a-transaction surprises later.
spring.jpa.open-in-view=false
