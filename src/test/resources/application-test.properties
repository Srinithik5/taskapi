# Used only by tests (@ActiveProfiles("test")) - a real H2 in-memory database, never
# the dev Postgres container. MODE=PostgreSQL makes H2 emulate Postgres syntax more
# closely, reducing "works in tests, fails for real" surprises.
spring.datasource.url=jdbc:h2:mem:taskapi_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-only-secret-key-never-used-outside-tests-32bytes
app.jwt.expiration-minutes=30

# Blank on purpose: no admin bootstrap needed for tests.
app.admin.email=
app.admin.password=
