services:
  db:
    image: postgres:16
    container_name: taskapi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: taskapi-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # SPRING_DATASOURCE_* env vars override application.properties entirely (Spring
      # Boot's relaxed env-var binding) - "db" is the service name above, resolved by
      # Docker Compose's internal DNS, NOT "localhost" (that would mean "this
      # container itself" from inside the api container, which has no Postgres on it).
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  db_data:
